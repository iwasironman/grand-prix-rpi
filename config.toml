# ============================================================================
#  Grand Prix RPi  —  Pinewood Derby race system configuration
#  Edit this file to match your hardware wiring and preferences.
#  Pin numbers are BCM GPIO numbers (the "GPIOxx" labels, not physical pins).
# ============================================================================

[race]
lanes = 4                 # number of physical lanes / cars per heat

# Playoffs after qualifying (change live in Settings too):
#   finalists      how many top qualifiers advance: 0 = none (qualifying decides),
#                  or 4 / 8.
#   finals_format  "rotation" = finalists run every lane (fair, multi-heat)
#                  "single"   = one winner-take-all final heat of the top 4
finalists = 4
finals_format = "rotation"

# Scoring method — how run times become a ranking. Change live in Settings too.
#   average     mean of all runs (fair, rewards consistency)
#   drop_worst  ignore each car's slowest run, then average (absorbs a fluke/DNF)
#   best        each car's single fastest run
#   total       sum of all runs (same order as average under a full rotation)
#   points      finishing-place points per heat, summed (low-point wins; timing-tolerant)
scoring = "average"

# Schedule density.  0 = each car runs once per lane (a single rotation).
#   = 2 * lanes  -> double rotation (each car runs every lane twice)
#   < lanes      -> reduced/faster schedule (each car runs about this many times)
runs_per_car = 0
dnf_timeout_s = 12.0      # if a lane never trips by now, mark it Did-Not-Finish
dnf_penalty_s = 9.999     # time used for a DNF when computing average rankings
end_double_tap_s = 0.8    # press the start button twice within this window to
                          # end a running heat early (guards against a stray bump)

[display]
fullscreen = true         # true on the Pi (HDMI kiosk); set false for a dev window
width = 1280              # window size when fullscreen = false
height = 720
fps = 60

[countdown]
# Drag-strip "Christmas tree" start sequence.
style = "tree"            # "tree" (amber bulbs -> green) or "numeric" (count down)
segments = 3              # number of amber bulbs that light in sequence
green_lights = 2          # number of GREEN bulbs at the bottom that light on go
stage_interval_s = 0.6    # time each amber bulb stays lit before the next
green_hold_s = 1.0        # how long GREEN shows after the gate releases

[hardware]
# backend: "auto" picks gpiozero on a Pi, otherwise the keyboard mock.
#   "mock" forces keyboard simulation (good for development on a laptop).
#   "gpio" forces the real GPIO backend.
backend = "auto"

# --- Start mode -------------------------------------------------------------
# How the race begins and when the clock (t0) starts:
#   "sensor" : MANUAL gate. The light tree counts down to GREEN; a human starter
#              releases the cars on green. Timing starts when the FIRST start-line
#              IR sensor is broken, and that t0 is shared by all lanes.
#   "servo"  : the servo releases the gate automatically on green, and t0 is the
#              moment of release. (Requires the start gate servo below.)
start_mode = "sensor"

# --- Start-line sensors (start_mode = "sensor"), one GPIO per lane ----------
# Same sensor type/polarity as the finish sensors (see finish_active_low).
# List MUST have exactly `race.lanes` entries.
start_pins = [22, 23, 24, 25]

# --- Start gate servo (start_mode = "servo") --------------------------------
servo_pin = 17            # BCM pin driving the gate servo signal wire
servo_closed = -0.6       # servo position that HOLDS the cars (range -1.0..1.0)
servo_open   = 0.6        # servo position that RELEASES the cars
servo_settle_s = 0.4      # time to let the servo finish moving

# --- Start control ----------------------------------------------------------
# The SPACE key on the keyboard always starts the countdown / ends a heat, so a
# physical button is optional.  Set start_button_enabled = true only if you wire
# a hardware pushbutton (it then does the same thing as SPACE).
start_button_enabled = false
start_button_pin = 27     # BCM pin for the pushbutton (only if enabled)
button_pull_up = true     # button wired to GND with internal pull-up (recommended)

# --- Finish-line sensors, one GPIO per lane ---------------------------------
# List MUST have exactly `race.lanes` entries, in lane order (lane 1 first).
# The internal pull-up is always enabled; this flag only sets which edge counts
# as a car crossing the line:
#   true  -> finish event drives the pin LOW
#            (reflective IR obstacle modules, e.g. LM393 boards: D0 = low on detect)
#   false -> finish event drives the pin HIGH
#            (through-beam receivers, e.g. Adafruit 2167: low while the beam is
#             intact, high when the car breaks it)
# Pin order is lane order, and lanes are named by color: Red, Blue, Green, Yellow.
finish_pins = [5, 6, 13, 19]
finish_active_low = false  # set false for Adafruit-style break-beam pairs

[storage]
database = "derby.db"     # SQLite file (created next to this config)
